name: Board

# Keeps the board, the file STATE.md on the branch "board", equal to what
# GitHub knows: the open issues, the claude/<issue> branches and their claim
# files, the open pull requests with how far each is from the default
# branch, and the five pull requests merged last. Every Claude session and
# every account reads it before claiming work (git fetch origin
# +refs/heads/board:refs/remotes/origin/board && git show
# origin/board:STATE.md; the session hook prints it).
# tools/board.py renders it from the REST API with GITHUB_TOKEN alone (no
# other secret is needed) and puts no wall-clock value in it, so the file
# changes only when the repository did, and only then is it written. The
# board branch holds exactly one commit, built below from the rendered file
# alone (hash-object, mktree, commit-tree; the checkout is never touched)
# and force-pushed in its place, so the default branch carries no board
# commit, no pull request falls behind because of one, and protection of
# the default branch never stands in the way; a ruleset must target only
# the default branch for the same reason (docs/setup/github.md). A push
# made with GITHUB_TOKEN starts no workflow, so this run cannot start itself
# again. Before the board is rendered, the same run is the coordinator's
# code (docs/agents/WORKERS.md): it releases each claim whose branch has
# gone a day without a commit, first taking claimed and the worker's label
# off, then commenting on its issue why, whose, what the branch holds and
# the plan, and putting the labels back when the comment fails, so the
# issue is as it was and the next run starts the release over; and it
# tells each piece of open work about other work
# that changes the same files, once per new piece; the board shows those
# files under Overlaps. The run comments once per commit of the default
# branch on a pull request that is behind it or in conflict with it, in
# whichever run first finds it so, and once on a pull request idle for
# more than a day; the comments carry HTML markers so a second run posts
# nothing twice. It renames the branch of a released claim to
# released/<issue>-<sha> (docs/agents/PROTOCOL.md, Release), in the run
# that released it, which frees the name for the next claim, keeps the work
# and closes the branch's pull request, and says so once on the issue;
# contents: write covers the rename, issues: write the labels, and a call
# GitHub refuses is only logged, so the board is still written. One run at
# a time; when events come in a burst, as a merge's four are, the runs
# wait their turn (queue: max, on the job below) instead of the newest replacing the
# one waiting, so no event's run is lost; and since no comment depends on
# the event that started the run, a run that were lost would cost only a
# delay to the next, at most the schedule's six hours. A run with a newer
# one waiting behind it stands back for it, unless a push to a claim
# branch started it (the gate step says why).
#
# The checkout is the default branch itself, whatever event started the
# run, so the board describes that branch's head (git rev-parse HEAD
# below). The branch's name comes from the event's repository object,
# which every trigger here carries, scheduled runs included;
# GITHUB_REF_NAME stands behind it only as a fallback. A branch made or deleted starts a run too, so a claim shows the
# moment it is pushed and a merged claim's branch leaves the board when it
# goes. The job is skipped in the template repository itself, for a push
# to any other branch, and for a pull request from a fork, whose token is
# read-only; scheduled runs carry the repository too, so the template's
# own schedule is skipped at the job (its run history shows it). The
# first step is a second layer for the two cases that gate cannot see: a
# template whose "Template repository" box was never ticked, and a copy
# whose template-init has not run yet. Both still hold the marker folder
# .template/, which template-init deletes, so the run ends there without
# writing anything. The last step tells a coordinator routine the board
# moved, for a repository that runs one (docs/agents/routines/coordinator.md),
# only when it did and the two secrets are set; it fails softly, so a
# routine that did not answer never turns the board red. In crowd mode
# (docs/setup/crowdsourcing.md) that step never runs: while the variable
# CLAUDE_CROWD is true its condition is false, so a trigger pair that reaches
# a crowd repository, from the organization for instance, cannot start the
# owner's routine on the owner's subscription whenever a writer moves the
# board; the crowd coordinator runs on its schedule alone.

on:
  push:
  create:
  delete:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    # The cron is a fallback for a missed webhook, not the engine: the
    # event triggers above carry every real change. Four runs a day cost
    # a private repository about 120 billed minutes a month where hourly
    # cost about 750, over a third of the Free plan's 2,000
    # (docs/setup/tiers.md); a public repository pays nothing either way.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  # actions: read lets a run see whether a newer one waits behind it (below).
  actions: read
  contents: write
  pull-requests: write
  issues: write

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

jobs:
  board:
    if: >-
      github.event.repository.is_template == false
      && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # On the job, not the workflow, so a run whose job is skipped (a push to
    # a claim branch, a fork's pull request) never waits in the line.
    # Up to a hundred jobs wait in the group in the order they arrived, in
    # place of GitHub's default, which cancels the job waiting when another
    # arrives: a merge fires four events at once, and the push to the default
    # branch's run was the one often cancelled (symphony-protocol, F12).
    concurrency:
      group: board
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}

      # The checkout is the default branch, so on a pull request that brings
      # the board (a setup branch, an adoption) the tool is not there yet:
      # that run is skipped, not red, and the first run after the merge
      # renders the board.
      #
      # A run stands back for a newer one waiting behind it, which starts
      # after this one would end and reads the whole state again, since
      # nothing the run writes depends on the event that started it but one
      # thing: a run started by a push to a claim branch (a branch made, or
      # a pull request's synchronize) dates that push at its own start, so
      # no claim is released in the run its push started (docs/agents/
      # PROTOCOL.md, Release). Those runs never stand back. A burst of
      # events, as a merge's four, then costs one full run, not four. Any
      # answer GitHub does not give leaves the run to go on as before.
      - name: Stop in the template itself, before the board's tool has landed, or for a newer run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          CARRIES_A_PUSH: ${{ github.event_name == 'create' || (github.event_name == 'pull_request' && github.event.action == 'synchronize') }}
        run: |
          newer_board_waits() {
            local workflow id waiting
            workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .workflow_id)" || return 1
            # Only runs whose job passes the job's own condition, so a run
            # whose job GitHub is about to skip (a push to another branch, a
            # fork's pull request) is never one this run stands back for.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=30" \
                --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER and .status != \"completed\")
                  | select(.event != \"push\" or .head_branch == \"$DEFAULT_BRANCH\")
                  | select(.event != \"pull_request\" or .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id"); do
              waiting="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name == "board" and .status != "completed" and .status != "in_progress")] | length')" || continue
              [ "${waiting:-0}" -gt 0 ] && return 0
            done
            return 1
          }
          if [ -e .template/PENDING ]; then
            echo "the template itself, or a copy not yet initialised; no board"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ ! -f tools/board.py ]; then
            echo "the default branch has no tools/board.py yet; no board until the pull request that brings it is merged"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$CARRIES_A_PUSH" != "true" ] && newer_board_waits; then
            echo "a newer board run waits behind this one and will read the same state later; this one stands back"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the previous board
        if: steps.gate.outputs.skip != 'true'
        run: |
          # By name, so a checkout made for one branch gets it too; no board
          # yet is not a failure. It is only compared with, below.
          git fetch --quiet origin +refs/heads/board:refs/remotes/origin/board 2>/dev/null \
            || echo "no board branch yet"

      - name: Render the board, rename released claims' branches and comment on waiting pull requests
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/board.py --default-branch "$DEFAULT_BRANCH" --sha "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/STATE.md"

      - name: Write the board to the branch board when it changed
        id: board
        if: steps.gate.outputs.skip != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rendered="$RUNNER_TEMP/STATE.md"
          if git show origin/board:STATE.md > "$RUNNER_TEMP/previous.md" 2>/dev/null \
             && cmp -s "$rendered" "$RUNNER_TEMP/previous.md"; then
            echo "board unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha7="$(git rev-parse HEAD | cut -c1-7)"
          blob="$(git hash-object -w "$rendered")"
          tree="$(printf '100644 blob %s\tSTATE.md\n' "$blob" | git mktree)"
          commit="$(git commit-tree "$tree" -m "Board as of $sha7")"
          git push --force --quiet origin "$commit:refs/heads/board"
          echo "board written as $commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tell the coordinator routine
        if: vars.CLAUDE_CROWD != 'true' && steps.board.outputs.changed == 'true'
        env:
          TRIGGER_URL: ${{ secrets.COORDINATOR_TRIGGER_URL }}
          TRIGGER_TOKEN: ${{ secrets.COORDINATOR_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TRIGGER_URL" ] || [ -z "$TRIGGER_TOKEN" ]; then
            echo "no coordinator trigger is set; skipped"
            exit 0
          fi
          # The routine's /fire endpoint ships under a dated beta header, which
          # Anthropic's own example sends with every call
          # (code.claude.com/docs/en/routines, "Trigger a routine"); when the
          # date moves, the two before it keep working for a while.
          curl -fsS -X POST "$TRIGGER_URL" \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "The board moved."}' \
            || echo "the coordinator did not answer; the board is written anyway"
